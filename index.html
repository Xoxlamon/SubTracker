<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SubTracker</title>
    <style>
        :root {
            --bg-color: #0f0f1a;
            --sidebar-bg: #1a1a2e;
            --text-color: #e0e0ff;
            --accent-color: #7b7bff;
            --border-color: #2a2a4a;
            --card-bg: #16162a;
            --input-bg: #0f0f1a;
        }

        [data-theme="light"] {
            --bg-color: #f0f2f5;
            --sidebar-bg: #ffffff;
            --text-color: #1a1a1a;
            --accent-color: #4f46e5;
            --border-color: #e5e7eb;
            --card-bg: #ffffff;
            --input-bg: #f9fafb;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; transition: background 0.3s, color 0.3s; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg-color); color: var(--text-color); min-height: 100vh; display: flex; }
        
        .sidebar { width: 220px; background: var(--sidebar-bg); padding: 20px; display: flex; flex-direction: column; gap: 10px; border-right: 1px solid var(--border-color); }
        .logo { color: var(--accent-color); font-size: 1.5rem; font-weight: 700; margin-bottom: 20px; }
        
        .nav-item { padding: 12px 16px; background: var(--card-bg); border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 12px; }
        .nav-item.active { background: var(--accent-color); color: #fff; }
        
        .theme-toggle { margin-top: auto; padding: 12px; cursor: pointer; border: 1px solid var(--border-color); border-radius: 8px; text-align: center; background: var(--card-bg); }
        
        .main { flex: 1; padding: 32px; overflow-y: auto; }
        .header { margin-bottom: 32px; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 32px; }
        .stat-card { background: var(--sidebar-bg); padding: 24px; border-radius: 12px; border: 1px solid var(--border-color); }
        .section { background: var(--sidebar-bg); padding: 24px; border-radius: 12px; border: 1px solid var(--border-color); margin-bottom: 24px; }
        
        .input-group input, .input-group select { padding: 12px; background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-color); width: 100%; }
        .btn { padding: 12px 24px; background: var(--accent-color); border: none; border-radius: 8px; color: #fff; cursor: pointer; width: 100%; }
        .sub-card { background: var(--card-bg); padding: 20px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border-color); margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo">SubTracker</div>
        <div class="nav-item active" onclick="showDashboard()">📊 Дашборд</div>
        <div class="nav-item" onclick="showSubscriptions()">📋 Подписки</div>
        <div class="theme-toggle" id="themeToggle" onclick="toggleTheme()">🌙 Темная тема</div>
    </div>
    
    <div class="main">
        <div id="dashboardView">
            <div class="header"><h1>Обзор</h1></div>
            <div class="stats">
                <div class="stat-card"><h3>В месяц</h3><div id="statMonth">0 ₽</div></div>
                <div class="stat-card"><h3>В год</h3><div id="statYear">0 ₽</div></div>
            </div>
        </div>

        <div id="subscriptionsView" style="display:none">
            <div class="section">
                <h2>Добавить</h2>
                <div class="input-group"><input type="text" id="subName" placeholder="Название"></div>
                <div class="input-group"><input type="number" id="subPrice" placeholder="Цена"></div>
                <button class="btn" onclick="addSubscription()" style="margin-top:10px">Добавить</button>
            </div>
            <div id="subsList"></div>
        </div>
    </div>

    <script>
        let subs = JSON.parse(localStorage.getItem('subscriptions')) || [];
        
        function toggleTheme() {
            const body = document.body;
            const current = body.getAttribute('data-theme');
            const next = current === 'light' ? 'dark' : 'light';
            body.setAttribute('data-theme', next);
            document.getElementById('themeToggle').innerText = next === 'light' ? '☀️ Светлая тема' : '🌙 Темная тема';
            localStorage.setItem('theme', next);
        }

        // Загрузка темы при старте
        if (localStorage.getItem('theme') === 'light') {
            document.body.setAttribute('data-theme', 'light');
            document.getElementById('themeToggle').innerText = '☀️ Светлая тема';
        }

        function showDashboard() {
            document.getElementById('dashboardView').style.display = 'block';
            document.getElementById('subscriptionsView').style.display = 'none';
        }

        function showSubscriptions() {
            document.getElementById('dashboardView').style.display = 'none';
            document.getElementById('subscriptionsView').style.display = 'block';
        }

        function addSubscription() {
            let name = document.getElementById('subName').value;
            let price = parseFloat(document.getElementById('subPrice').value);
            if(name && price) {
                subs.push({id: Date.now(), name, price});
                localStorage.setItem('subscriptions', JSON.stringify(subs));
                render();
            }
        }

        function render() {
            let total = subs.reduce((s, a) => s + a.price, 0);
            document.getElementById('statMonth').innerText = total + ' ₽';
            document.getElementById('statYear').innerText = (total * 12) + ' ₽';
            document.getElementById('subsList').innerHTML = subs.map(s => `
                <div class="sub-card">
                    <span>${s.name}</span>
                    <b>${s.price} ₽</b>
                </div>
            `).join('');
        }
        render();
    </script>
</body>
</html>
